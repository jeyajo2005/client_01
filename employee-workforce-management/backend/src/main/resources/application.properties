# ====================================================================
# EMPLOYEE WORKFORCE MANAGEMENT SYSTEM - APPLICATION PROPERTIES
# ====================================================================

spring.application.name=Employee Workforce Management System
server.port=8080

# --------------------------------------------------------------------
# DATABASE CONFIGURATION (Zero-Setup In-Memory Database)
# To use MySQL instead, run: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
# --------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:workforce_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Jackson JSON serialization configuration
spring.jackson.serialization.fail-on-empty-beans=false

# --------------------------------------------------------------------
# FILE UPLOAD LIMITS (For Selfie Attendance)
# --------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/selfies

# --------------------------------------------------------------------
# JWT SECURITY SETTINGS
# --------------------------------------------------------------------
# Secret key (HMAC SHA256 base64 encoded minimum 256 bits)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-milliseconds=86400000

# --------------------------------------------------------------------
# CORS CONFIGURATION
# --------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# --------------------------------------------------------------------
# SWAGGER / OPENAPI SPECIFICATION
# --------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
